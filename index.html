<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5a3c15" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Memory Codex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Scripture Memory Codex</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f0e7;
      --surface: #fffdf7;
      --surface-2: #ebe5d9;
      --ink: #17201b;
      --muted: #667068;
      --line: #d9d2c5;
      --accent: #2f5c46;
      --accent-strong: #244838;
      --accent-soft: #dce9e0;
      --gold: #967331;
      --danger: #8b2e2e;
      --warning: #8a5f16;
      --shadow: 0 12px 34px rgba(32, 42, 35, .10);
      --radius: 18px;
      --nav-height: 76px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #111713;
        --surface: #18201b;
        --surface-2: #222c25;
        --ink: #f1eee5;
        --muted: #abb5ad;
        --line: #364139;
        --accent: #7fb393;
        --accent-strong: #9cc8aa;
        --accent-soft: #263c2e;
        --gold: #d0ae68;
        --danger: #ef8e8e;
        --warning: #e7bd6e;
        --shadow: 0 12px 34px rgba(0, 0, 0, .24);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111713;
      --surface: #18201b;
      --surface-2: #222c25;
      --ink: #f1eee5;
      --muted: #abb5ad;
      --line: #364139;
      --accent: #7fb393;
      --accent-strong: #9cc8aa;
      --accent-soft: #263c2e;
      --gold: #d0ae68;
      --danger: #ef8e8e;
      --warning: #e7bd6e;
      --shadow: 0 12px 34px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--accent-soft) 52%, transparent), transparent 38%),
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { letter-spacing: -.025em; }
    a { color: var(--accent); }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 66px; padding: max(12px, env(safe-area-inset-top)) 18px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }
    .brand { display: flex; gap: 11px; align-items: center; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      display: grid; place-items: center;
      background: var(--accent); color: white; font-weight: 800; box-shadow: var(--shadow);
    }
    .brand-text strong { display: block; font-size: .98rem; }
    .brand-text span { color: var(--muted); font-size: .76rem; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--line);
      background: var(--surface); display: grid; place-items: center; cursor: pointer;
    }

    main {
      width: min(980px, 100%); margin: 0 auto;
      padding: 22px 16px calc(var(--nav-height) + env(safe-area-inset-bottom) + 24px);
    }
    .view { animation: fadeIn .18s ease; }
    @keyframes fadeIn { from { opacity: .35; transform: translateY(3px); } }

    .hero {
      display: grid; gap: 18px;
      grid-template-columns: 1.35fr .65fr;
      margin-bottom: 18px;
    }
    .hero-card, .card {
      background: color-mix(in srgb, var(--surface) 97%, transparent);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero-card { padding: 24px; overflow: hidden; position: relative; }
    .hero-card::after {
      content: ""; position: absolute; width: 170px; height: 170px; right: -70px; bottom: -85px;
      border-radius: 50%; background: var(--accent-soft); opacity: .8;
    }
    .eyebrow {
      color: var(--accent); text-transform: uppercase; letter-spacing: .14em;
      font-size: .72rem; font-weight: 800; margin-bottom: 9px;
    }
    .hero h1 { font-family: ui-serif, Georgia, serif; font-size: clamp(1.75rem, 5vw, 2.65rem); margin-bottom: 10px; }
    .hero p { color: var(--muted); line-height: 1.55; max-width: 58ch; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; position: relative; z-index: 2; }

    .stats-card { padding: 18px; display: grid; gap: 10px; }
    .stat-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .stat-row:last-child { border-bottom: 0; }
    .stat-row strong { font-size: 1.55rem; }
    .stat-row span { color: var(--muted); font-size: .88rem; }

    .section-head {
      display: flex; align-items: end; justify-content: space-between; gap: 12px;
      margin: 26px 2px 12px;
    }
    .section-head h2 { margin: 0; font-size: 1.17rem; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: .88rem; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { padding: 18px; }
    .metric strong { display: block; font-size: 1.55rem; margin-bottom: 4px; }
    .metric span { color: var(--muted); font-size: .86rem; }

    .btn {
      min-height: 44px; border: 0; border-radius: 13px; padding: 11px 16px;
      font-weight: 750; cursor: pointer; transition: transform .12s ease, background .12s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-secondary { background: var(--surface-2); border: 1px solid var(--line); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); }
    .btn-danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 38%, transparent); }
    .btn-small { min-height: 36px; padding: 8px 11px; font-size: .84rem; border-radius: 11px; }
    .btn[disabled] { opacity: .48; cursor: not-allowed; }

    .empty {
      text-align: center; padding: 34px 22px; border: 1px dashed var(--line);
      background: color-mix(in srgb, var(--surface) 84%, transparent); border-radius: var(--radius);
    }
    .empty-mark {
      width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 15px;
      display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
      font-weight: 900; font-size: 1.35rem;
    }
    .empty p { color: var(--muted); max-width: 50ch; margin-inline: auto; line-height: 1.5; }

    .passage-list { display: grid; gap: 10px; }
    .passage-card {
      display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 15px;
    }
    .passage-card h3 { margin: 0 0 5px; font-family: ui-serif, Georgia, serif; font-size: 1.06rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: .78rem; }
    .badge {
      display: inline-flex; align-items: center; min-height: 25px; padding: 4px 8px;
      border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
      font-size: .72rem; font-weight: 750;
    }
    .badge-accent { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); }
    .card-actions { display: flex; gap: 7px; }

    .toolbar {
      display: grid; grid-template-columns: 1fr minmax(150px, 220px); gap: 10px; margin-bottom: 14px;
    }
    .input, textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 13px;
      background: var(--surface); color: var(--ink); padding: 12px 13px; outline: none;
    }
    .input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    textarea { min-height: 148px; resize: vertical; line-height: 1.55; }
    label { display: block; font-weight: 750; font-size: .84rem; margin-bottom: 7px; }
    .help { color: var(--muted); font-size: .77rem; line-height: 1.45; margin-top: 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 15px; }
    .full { grid-column: 1 / -1; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

    .progress-track { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: inherit; }
    .ladder { display: grid; gap: 10px; }
    .ladder-row {
      display: grid; grid-template-columns: 32px 1fr auto; gap: 11px; align-items: center;
      padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line);
    }
    .ladder-num { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); font-weight: 850; }
    .ladder-row strong { display: block; font-size: .9rem; }
    .ladder-row span { color: var(--muted); font-size: .76rem; }

    .review-shell { max-width: 760px; margin: 0 auto; }
    .review-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .review-progress { flex: 1; }
    .review-card {
      min-height: 470px; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: var(--shadow); padding: clamp(20px, 5vw, 34px);
    }
    .review-stage {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      margin-bottom: 26px;
    }
    .review-stage .badge { font-size: .76rem; }
    .reference {
      font-family: ui-serif, Georgia, serif; text-align: center;
      font-size: clamp(1.5rem, 6vw, 2.35rem); margin: 18px 0 22px;
    }
    .scripture {
      font-family: ui-serif, Georgia, serif; font-size: clamp(1.17rem, 4vw, 1.42rem);
      line-height: 1.75; white-space: pre-wrap; max-width: 62ch; margin: 0 auto;
    }
    .instruction { color: var(--muted); text-align: center; line-height: 1.55; max-width: 60ch; margin: 0 auto 18px; }
    .memory-prompt {
      padding: 20px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line);
      margin: 0 auto 18px; width: 100%;
    }
    .memory-prompt .scripture { font-size: clamp(1rem, 3.5vw, 1.25rem); }
    .blank {
      display: inline-block; min-width: 3.4em; border-bottom: 2px solid var(--muted); color: transparent;
      transform: translateY(-2px); user-select: none;
    }
    .first-letters { letter-spacing: .06em; word-spacing: .22em; }
    .review-spacer { flex: 1; min-height: 22px; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
    .typing-area { min-height: 180px; }
    .compare-box { margin-top: 15px; padding: 15px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
    .diff-good { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
    .diff-bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-radius: 4px; }

    .grade-panel { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
    .grade-panel h3 { text-align: center; font-size: .95rem; margin-bottom: 12px; }
    .grade-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .grade-btn {
      min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
      cursor: pointer; padding: 6px 3px; font-weight: 850;
    }
    .grade-btn span { display: block; color: var(--muted); font-size: .62rem; font-weight: 650; margin-top: 2px; }

    .bottom-nav {
      position: fixed; z-index: 40; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(680px, 100%); min-height: var(--nav-height);
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: start;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--surface) 91%, transparent);
      backdrop-filter: blur(20px); border: 1px solid var(--line); border-bottom: 0;
      border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.08);
    }
    .nav-btn {
      border: 0; background: transparent; min-height: 50px; border-radius: 13px;
      display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted);
      cursor: pointer; font-size: .68rem; font-weight: 750;
    }
    .nav-btn .nav-icon { font-size: 1.15rem; line-height: 1; }
    .nav-btn.active { background: var(--accent-soft); color: var(--accent); }

    dialog {
      width: min(620px, calc(100% - 28px)); border: 1px solid var(--line); border-radius: 20px;
      background: var(--surface); color: var(--ink); padding: 0; box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0,0,0,.52); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 1.1rem; }
    .dialog-body { padding: 20px; max-height: 72vh; overflow-y: auto; }

    .notice { padding: 13px 15px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); line-height: 1.45; font-size: .84rem; }
    .notice-warning { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
    .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-copy strong { display: block; font-size: .92rem; }
    .setting-copy span { display: block; color: var(--muted); font-size: .77rem; margin-top: 3px; line-height: 1.4; }
    .setting-control { width: min(145px, 42vw); }

    .toast {
      position: fixed; z-index: 100; left: 50%; bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + 18px);
      transform: translateX(-50%) translateY(18px); opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); padding: 12px 15px; border-radius: 12px;
      background: var(--ink); color: var(--bg); font-weight: 750; font-size: .84rem;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .toolbar, .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .passage-card { grid-template-columns: 1fr; }
      .card-actions { justify-content: flex-start; }
      .review-card { min-height: 540px; }
      .grade-grid { grid-template-columns: repeat(3, 1fr); }
      .brand-text span { display: none; }
    }

    @media (min-width: 840px) {
      main { padding-bottom: 34px; }
      .bottom-nav {
        position: sticky; top: 78px; bottom: auto; transform: none; left: auto;
        width: min(680px, calc(100% - 32px)); margin: 0 auto 12px; border-radius: 18px;
        border-bottom: 1px solid var(--line); padding-bottom: 8px; min-height: 64px;
      }
      .toast { bottom: 24px; }
    }

    /* Chapter-path additions */
    .chapter-hero { margin-top: 18px; }
    .chapter-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .chapter-heading h2, .chapter-library-head h1 { font-family: ui-serif, Georgia, serif; margin-bottom: 7px; }
    .chapter-heading p, .chapter-library-head p { color: var(--muted); line-height: 1.5; margin-bottom: 0; }
    .chapter-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0 16px; }
    .chapter-bar-label { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .78rem; margin-bottom: 7px; }
    .chapter-bar-label strong { color: var(--ink); }
    .mastery-fill { background: var(--gold); }
    .flow-map { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 13px; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: .78rem; }
    .flow-map span { color: var(--ink); font-weight: 750; }
    .flow-map b { color: var(--accent); }
    .next-target { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; padding: 13px 14px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 14px; background: var(--accent-soft); }
    .next-target span { display: block; color: var(--accent); font-size: .7rem; text-transform: uppercase; letter-spacing: .11em; font-weight: 850; }
    .next-target strong { display: block; margin-top: 4px; font-size: .9rem; }
    .argument-card { margin-bottom: 16px; }
    .argument-card h2 { margin-bottom: 14px; }
    .argument-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .argument-step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 11px; border-radius: 13px; background: var(--surface-2); }
    .argument-step > span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--accent); font-weight: 900; }
    .argument-step strong { font-size: .78rem; color: var(--accent); }
    .argument-step p { margin: 2px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .unit-stack { display: grid; gap: 14px; }
    .unit-card { padding: 20px; }
    .unit-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
    .unit-head h2 { font-family: ui-serif, Georgia, serif; font-size: 1.15rem; margin: 4px 0 6px; }
    .unit-head p { color: var(--muted); font-size: .82rem; line-height: 1.45; margin: 0; }
    .unit-head > strong { color: var(--accent); font-size: 1.05rem; }
    .unit-range { color: var(--accent); font-weight: 850; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .path-list { display: grid; gap: 7px; margin-top: 13px; }
    .path-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; min-height: 56px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 13px; background: color-mix(in srgb, var(--surface) 86%, transparent); }
    .path-copy strong { display: block; font-size: .86rem; line-height: 1.35; }
    .path-copy span { display: block; color: var(--muted); font-size: .72rem; margin-top: 3px; }
    .status-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: var(--surface-2); color: var(--muted); }
    .status-ready .status-dot { background: var(--accent-soft); color: var(--accent); }
    .status-learning .status-dot { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
    .status-mastered .status-dot { background: var(--accent); color: white; }
    .status-locked { opacity: .64; }
    .lock-mark { color: var(--muted); padding: 8px; }
    .milestone-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .milestone-card { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; }
    .milestone-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: var(--accent-soft); color: var(--accent); font-weight: 900; font-size: 1.15rem; }
    .milestone-card h3 { margin: 7px 0 3px; font-family: ui-serif, Georgia, serif; }
    .milestone-card p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .verse-number { color: var(--accent); font-family: ui-sans-serif, sans-serif; font-size: .62em; font-weight: 850; margin-right: .28em; vertical-align: super; }
    .verse-chunk { display: inline; }
    .no-cue { text-align: center; color: var(--muted); font-family: ui-sans-serif, sans-serif; font-size: .95rem !important; letter-spacing: .08em; text-transform: uppercase; }
    .progress-summary { margin-top: 16px; }
    .activity-bars { height: 150px; display: flex; align-items: end; gap: 4px; }
    .activity-bars > div { flex: 1; min-width: 3px; background: var(--accent); opacity: .82; border-radius: 5px 5px 2px 2px; }
    .trouble-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .complete-card { justify-content: center; text-align: center; min-height: 470px; }
    .complete-card h1 { font-family: ui-serif, Georgia, serif; }
    .unlock-summary { display: grid; gap: 5px; margin: 12px auto; width: min(520px, 100%); padding: 14px; border-radius: 14px; background: var(--accent-soft); text-align: left; }
    .unlock-summary span { color: var(--accent); text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; font-weight: 850; }
    .unlock-summary strong { font-size: .82rem; }

    @media (max-width: 720px) {
      .chapter-heading, .unit-head { display: grid; }

<script>
  "use strict";

  const STORAGE_KEY = "scripture-memory-gauntlet.v1";
  const APP_VERSION = 4;
  const ROMANS_CHAPTER_ID = "romans-1";

  const LEVELS = {
    1: { name: "Read", description: "Read slowly, notice the argument, and speak the words aloud." },
    2: { name: "Fill blanks", description: "Recover omitted words from context." },
    3: { name: "First letters", description: "Use initials as a minimal cue." },
    4: { name: "Type", description: "Produce the wording from memory." },
    5: { name: "Recite", description: "Recall aloud without textual help." }
  };

  const ROMANS_1_VERSES = {
    1: "Paul, a slave of Christ Jesus, called as an apostle, having been set apart for the gospel of God,",
    2: "which He promised beforehand through His prophets in the holy Scriptures,",
    3: "concerning His Son, who was born of the seed of David according to the flesh,",
    4: "who was designated as the Son of God in power, according to the Spirit of holiness, by the resurrection from the dead, Jesus Christ our Lord,",
    5: "through whom we received grace and apostleship for the obedience of faith among all the Gentiles for the sake of His name,",
    6: "among whom you also are the called of Jesus Christ;",
    7: "to all who are beloved of God in Rome, called as saints: Grace to you and peace from God our Father and the Lord Jesus Christ.",
    8: "First, I thank my God through Jesus Christ for you all, because your faith is being proclaimed throughout the whole world.",
    9: "For God, whom I serve in my spirit in the gospel of His Son, is my witness as to how without ceasing I make mention of you,",
    10: "always in my prayers earnestly asking, if perhaps now at last by the will of God I may succeed in coming to you.",
    11: "For I long to see you so that I may impart some spiritual gift to you, that you may be strengthened;",
    12: "that is, to be mutually encouraged, while among you, by each other’s faith, both yours and mine.",
    13: "I do not want you to be unaware, brothers, that often I have planned to come to you (and have been prevented so far) so that I may have some fruit among you also, even as among the rest of the Gentiles.",
    14: "I am under obligation both to Greeks and to barbarians, both to the wise and to the foolish.",
    15: "In this way, for my part, I am eager to proclaim the gospel to you also who are in Rome.",
    16: "For I am not ashamed of the gospel, for it is the power of God for salvation to everyone who believes, to the Jew first and also to the Greek.",
    17: "For in it the righteousness of God is revealed from faith to faith; as it is written, “But the righteous will live by faith.”",
    18: "For the wrath of God is revealed from heaven against all ungodliness and unrighteousness of men who suppress the truth in unrighteousness,",
    19: "because that which is known about God is evident within them; for God made it evident to them.",
    20: "For since the creation of the world His invisible attributes, both His eternal power and divine nature, have been clearly seen, being understood through what has been made, so that they are without excuse.",
    21: "For even though they knew God, they did not glorify Him as God or give thanks, but they became futile in their thoughts, and their foolish heart was darkened.",
    22: "Professing to be wise, they became fools,",
    23: "and exchanged the glory of the incorruptible God for an image in the likeness of corruptible man and of birds and four-footed animals and crawling creatures.",
    24: "Therefore God gave them over in the lusts of their hearts to impurity, so that their bodies would be dishonored among them.",
    25: "For they exchanged the truth of God for a lie, and worshiped and served the creature rather than the Creator, who is blessed forever. Amen.",
    26: "For this reason God gave them over to dishonorable passions; for their females exchanged the natural function for that which is unnatural,",
    27: "and in the same way also the males abandoned the natural function of the female and burned in their desire toward one another, males with males committing indecent acts and receiving in their own persons the due penalty of their error.",
    28: "And just as they did not see fit to acknowledge God, God gave them over to an unfit mind, to do those things which are not proper,",
    29: "having been filled with all unrighteousness, wickedness, greed, evil; full of envy, murder, strife, deceit, malice; they are gossips,",
    30: "slanderers, haters of God, violent, arrogant, boastful, inventors of evil, disobedient to parents,",
    31: "without understanding, untrustworthy, unloving, unmerciful;",
    32: "and although they know the righteous requirement of God, that those who practice such things are worthy of death, they not only do the same, but also give hearty approval to those who practice them."
  };

  const ROMANS_UNITS = [
    { id: "r1-u1", range: "1:1–7", title: "The gospel promised and centered in God’s Son", summary: "Paul’s calling, the promised gospel, Christ’s identity, and grace to Rome." },
    { id: "r1-u2", range: "1:8–15", title: "Paul’s gratitude, prayers, and obligation", summary: "Paul longs to strengthen the Romans and proclaim the gospel among them." },
    { id: "r1-u3", range: "1:16–17", title: "The gospel: God’s power and righteousness", summary: "The thesis of Romans: salvation and righteousness revealed by faith." },
    { id: "r1-u4", range: "1:18–23", title: "Wrath revealed against suppressed truth", summary: "God is known through creation, yet humanity refuses to honor Him." },
    { id: "r1-u5", range: "1:24–25", title: "God gives them over to impurity", summary: "The truth of God is exchanged for a lie and the creature is worshiped." },
    { id: "r1-u6", range: "1:26–27", title: "God gives them over to dishonorable passions", summary: "The second movement in Paul’s threefold ‘gave them over’ indictment." },
    { id: "r1-u7", range: "1:28–32", title: "God gives them over to an unfit mind", summary: "The final giving over culminates in a catalogue of unrighteousness." }
  ];

  function romansText(start, end) {
    const parts = [];
    for (let verse = start; verse <= end; verse += 1) parts.push(ROMANS_1_VERSES[verse]);
    return parts.join(" ");
  }

  function seedPassage(config) {
    return {
      id: config.id,
      seedKey: config.id,

    let hash = 2166136261;
    for (let i = 0; i < str.length; i += 1) {

  }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(loaded));

      if (!existing.has(p.seedKey)) targetState.passages.push(normalizePassage(p));

    if (!p.prerequisites.length) return true;
    return p.prerequisites.every(id => (passageById(id, sourceState)?.passes || 0) >= 1);

        p.unlockedAt = new Date().toISOString();
        newlyUnlocked.push(p.id);

  async function importBackup() {
    const input = document.getElementById("importFile");
    const file = input.files?.[0];
    if (!file) { toast("Choose a JSON backup first"); return; }
    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed.passages)) throw new Error("No passages array found");
      const incoming = parsed.passages.map(normalizePassage);
      const replace = confirm(`Import ${incoming.length} passages? Press OK to replace current data, or Cancel to merge.`);
      if (replace) {
        state = {
          ...defaultState(),
          ...parsed,
          version: APP_VERSION,
          settings: { ...defaultState().settings, ...(parsed.settings || {}) },
          meta: { ...defaultState().meta, ...(parsed.meta || {}) },
          passages: incoming,
          reviewLog: Array.isArray(parsed.reviewLog) ? parsed.reviewLog : []
        };
      } else {
        const keys = new Set(state.passages.map(p => p.seedKey || `${p.reference.toLowerCase()}|${p.text}`));
        incoming.forEach(p => {
          const key = p.seedKey || `${p.reference.toLowerCase()}|${p.text}`;
          if (!keys.has(key)) { state.passages.push(p); keys.add(key); }
        });
        if (Array.isArray(parsed.reviewLog)) state.reviewLog.push(...parsed.reviewLog);
      }
      seedRomansChapter(state);
      refreshUnlocks(state);
      saveState();
      document.getElementById("importDialog").close();
      input.value = "";
      applyTheme();
      renderAll();
      toast("Backup imported");
    } catch (error) {
      console.error(error);
      toast("That backup could not be imported");
    }
  }

  function buildChallenge(p) {
    const base = {
      reference: p.reference,
      text: p.text,
      verseStart: p.verseStart,
      verseEnd: p.verseEnd,
      mode: "full",
      label: kindLabel(p.kind),
      instruction: "Recite the entire passage aloud without textual help. Reveal only after completing your attempt."
    };
    if (p.level !== 5 || !p.chapterId || p.kind === "segment") return base;

    const cycle = p.repetitions % 3;
    if (cycle === 1 && p.verseStart && p.verseEnd && p.verseEnd - p.verseStart >= 2) {
      const candidates = [p.verseStart + 1, ...p.boundaries.map(v => v + 1)].filter(v => v > p.verseStart && v <= p.verseEnd);
      const start = candidates[stableHash(`${p.id}:${p.repetitions}:entry`) % candidates.length];
      return {
        ...base,
        reference: `Romans 1:${start}–${p.verseEnd}`,
        text: romansText(start, p.verseEnd),
        verseStart: start,
        mode: "random-entry",
        label: "Random-entry drill",
        instruction: `Begin precisely at verse ${start} and continue through verse ${p.verseEnd}. This prevents dependence on always starting at the beginning.`
      };
    }
    if (cycle === 2 && p.boundaries.length) {
      const boundary = p.boundaries[stableHash(`${p.id}:${p.repetitions}:transition`) % p.boundaries.length];
      const start = Math.max(p.verseStart, boundary - 1);
      const end = Math.min(p.verseEnd, boundary + 1);
      return {
        ...base,
        reference: `Romans 1:${start}–${end}`,
        text: romansText(start, end),
        verseStart: start,
        verseEnd: end,
        mode: "transition",
        label: "Transition drill",
        instruction: `Recite verses ${start}–${end}, carrying the wording cleanly across the boundary after verse ${boundary}.`
      };
    }
    return base;
  }

            <h3>How complete and independent was your recall?</h3>
            <div class="grade-grid">
              ${[[0,"Blank"],[1,"Recognized"],[2,"Major help"],[3,"Minor errors"],[4,"Accurate"],[5,"Effortless"]].map(([rating, label]) => `<button class="grade-btn" data-rating="${rating}">${rating}<span>${label}</span></button>`).join("")}
            </div>
            <p class="help" style="text-align:center;margin-top:11px">Ratings 4–5 unlock the next path item only after an active-recall level.</p>
          </div>
        </article>
      </div>`;

    document.getElementById("exitReviewBtn").addEventListener("click", () => {
      reviewSession = null;
      renderAll();
      switchView("today");
    });
    bindReviewControls(p);
  }

  function reviewContentHTML(p, challenge) {
    if (p.level === 1) {
      return `<div class="reference">${challenge.reference.startsWith("Romans") ? illuminateHTML(challenge.reference) : escapeHTML(challenge.reference)}</div>
        <p class="instruction">Read aloud attentively. Notice conjunctions, repeated language, and how this segment advances Paul’s argument.</p>
        <div class="memory-prompt"><div class="scripture">${scriptureHTML(challenge, p)}</div></div>
        <div class="review-actions"><button class="btn btn-primary" id="readyToGradeBtn">I read it carefully</button></div>`;
    }
    if (p.level === 2) {
      return `<div class="reference">${challenge.reference.startsWith("Romans") ? illuminateHTML(challenge.reference) : escapeHTML(challenge.reference)}</div>
        <p class="instruction">Supply every hidden word aloud before revealing the passage. Previously missed words are hidden first.</p>
        <div class="memory-prompt"><div class="scripture">${clozeHTML(challenge, p)}</div></div>
        <div class="review-actions"><button class="btn btn-primary" id="revealBtn">Reveal passage</button></div>`;
    }
    if (p.level === 3) {
      return `<div class="reference">${challenge.reference.startsWith("Romans") ? illuminateHTML(challenge.reference) : escapeHTML(challenge.reference)}</div>
        <p class="instruction">Use only first letters and verse markers. Recite the complete wording aloud.</p>
        <div class="memory-prompt"><div class="scripture first-letters">${firstLettersHTML(challenge, p)}</div></div>
        <div class="review-actions"><button class="btn btn-primary" id="revealBtn">Reveal passage</button></div>`;
    }
    if (p.level === 4) {
      return `<div class="reference">${challenge.reference.startsWith("Romans") ? illuminateHTML(challenge.reference) : escapeHTML(challenge.reference)}</div>
        <p class="instruction">Type the passage from memory. The comparison will record missed words for targeted repair.</p>
        <textarea class="typing-area" id="typingAnswer" placeholder="Type from memory…" autocapitalize="sentences" spellcheck="false"></textarea>
        <div id="compareResult"></div>
        <div class="review-actions"><button class="btn btn-primary" id="compareBtn">Compare answer</button></div>`;
    }
    return `<div class="reference">${challenge.reference.startsWith("Romans") ? illuminateHTML(challenge.reference) : escapeHTML(challenge.reference)}</div>
      <p class="instruction">${escapeHTML(challenge.instruction)}</p>
      <div class="memory-prompt"><div class="scripture no-cue">No textual cue</div></div>
      <div class="review-actions"><button class="btn btn-primary" id="revealBtn">Reveal expected passage</button></div>`;
  }

  function scriptureHTML(challenge, p) {
    if (p.chapterId === ROMANS_CHAPTER_ID && challenge.verseStart && challenge.verseEnd) {
      const chunks = [];
      for (let verse = challenge.verseStart; verse <= challenge.verseEnd; verse += 1) {
        chunks.push(`<span class="verse-chunk"><sup class="verse-number">${verse}</sup>${escapeHTML(ROMANS_1_VERSES[verse])}</span>`);
      }
      return chunks.join(" ");
    }
    return escapeHTML(challenge.text);
  }

  function clozeHTML(challenge, p) {
    const words = challenge.text.split(/(\s+)/);
    const eligible = [];
    words.forEach((token, index) => {
      const bare = normalizeWord(token);
      if (bare.length >= 3) eligible.push({ index, bare, trouble: Number(p.troubleWords?.[bare] || 0), score: stableHash(`${p.id}:${challenge.reference}:${index}`) });
    });
    const target = Math.max(1, Math.round(eligible.length * state.settings.clozePercent / 100));
    eligible.sort((a, b) => b.trouble - a.trouble || a.score - b.score);
    const hidden = new Set(eligible.slice(0, target).map(item => item.index));
    return words.map((token, index) => {
      if (!hidden.has(index)) return escapeHTML(token);
      const leading = token.match(/^\W*/u)?.[0] || "";
      const trailing = token.match(/\W*$/u)?.[0] || "";
      const bare = token.slice(leading.length, token.length - trailing.length || undefined);
      return `${escapeHTML(leading)}<span class="blank" aria-label="hidden word">${escapeHTML(bare)}</span>${escapeHTML(trailing)}`;
    }).join("");
  }

  function firstLetters(text) {
    return text.replace(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu, word => word[0]).replace(/([.!?;:])(?=\S)/g, "$1 ");
  }

  function firstLettersHTML(challenge, p) {
    if (p.chapterId === ROMANS_CHAPTER_ID && challenge.verseStart && challenge.verseEnd) {
      const chunks = [];
      for (let verse = challenge.verseStart; verse <= challenge.verseEnd; verse += 1) {
        chunks.push(`<span class="verse-chunk"><sup class="verse-number">${verse}</sup>${escapeHTML(firstLetters(ROMANS_1_VERSES[verse]))}</span>`);
      }
      return chunks.join(" ");
    }
    return escapeHTML(firstLetters(challenge.text));
  }

  function bindReviewControls(p) {
    document.getElementById("readyToGradeBtn")?.addEventListener("click", showGradePanel);
    document.getElementById("revealBtn")?.addEventListener("click", () => revealPassage(p));
    document.getElementById("compareBtn")?.addEventListener("click", () => compareTypedAnswer(p));
    document.querySelectorAll(".grade-btn").forEach(btn => btn.addEventListener("click", () => gradeCurrent(Number(btn.dataset.rating))));
  }

  function showGradePanel() {
    document.getElementById("gradePanel")?.classList.remove("hidden");
    document.getElementById("gradePanel")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function revealPassage(p) {
    if (reviewSession.revealed) return;
    reviewSession.revealed = true;
    const prompt = document.querySelector(".memory-prompt");
    if (prompt) prompt.innerHTML = `<div class="scripture">${scriptureHTML(reviewSession.challenge, p)}</div>`;
    document.getElementById("revealBtn")?.classList.add("hidden");
    showGradePanel();
  }

  function normalizeForCompare(text) {
    let output = String(text).normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
    if (!state.settings.strictPunctuation) output = output.replace(/[^\p{L}\p{N}'’-]+/gu, " ").toLowerCase();
    return output.trim().replace(/\s+/g, " ");
  }

  function compareTypedAnswer(p) {
    const answer = document.getElementById("typingAnswer").value;
    if (!answer.trim()) { toast("Type your attempt first"); return; }
    reviewSession.typedCompared = true;
    const expectedWords = normalizeForCompare(reviewSession.challenge.text).split(" ");
    const answerWords = normalizeForCompare(answer).split(" ");
    const max = Math.max(expectedWords.length, answerWords.length);
    let matches = 0;
    const output = [];
    const missed = [];
    for (let i = 0; i < max; i += 1) {
      const expected = expectedWords[i];
      const actual = answerWords[i];
      if (expected && actual && expected === actual) {
        matches += 1;
        output.push(`<span class="diff-good">${escapeHTML(expected)}</span>`);
      } else if (expected) {
        output.push(`<span class="diff-bad" title="Your word: ${escapeHTML(actual || "missing")}">${escapeHTML(expected)}</span>`);
        const key = normalizeWord(expected);
        if (key.length >= 3) missed.push(key);
      }
    }
    reviewSession.missedWords = missed;
    const accuracy = Math.round(matches / Math.max(1, expectedWords.length) * 100);
    document.getElementById("compareResult").innerHTML = `<div class="compare-box"><strong>${accuracy}% word-position match</strong><div class="help" style="margin:6px 0 12px">Red words were missing or different at that position. They will be prioritized in future cloze drills.</div><div class="scripture" style="font-size:1rem">${output.join(" ")}</div></div>`;
    document.getElementById("compareBtn").classList.add("hidden");
    showGradePanel();
  }

  function calculateSchedule(p, rating) {
    const oldInterval = Math.max(0, p.interval || 0);
    let interval = oldInterval;
    let level = p.level;

    if (p.level === 1) {
      if (rating >= 3) { interval = 0; level = 2; }
      else if (rating === 2) { interval = 0; level = 1; }
      else if (rating === 1) { interval = 1; level = 1; }
      else { interval = 0; level = 1; }
      return { interval, level, dueDate: addDaysISO(interval) };
    }

    if (rating === 0) interval = 0;
    else if (rating === 1) interval = 1;
    else if (rating === 2) interval = 2;
    else if (rating === 3) interval = Math.max(3, Math.round(oldInterval * 1.25) || 4);
    else if (rating === 4) interval = Math.max(level * 2, Math.round(oldInterval * 1.8) || 7);
    else interval = Math.max(level * 3, Math.round(oldInterval * 2.35) || 14);
    interval = Math.min(interval, 365);

    if (rating >= 4) level = Math.min(5, level + 1);
    else if (rating <= 1) level = Math.max(1, level - 1);
    else if (rating === 2 && level > 2) level -= 1;

    return { interval, level, dueDate: addDaysISO(interval) };
  }

  function gradeCurrent(rating) {
    const p = currentReviewPassage();
    if (!p) return;
    const challenge = reviewSession.challenge;
    const before = { level: p.level, interval: p.interval };
    const next = calculateSchedule(p, rating);
    const reviewedAt = new Date().toISOString();
    const qualifyingPass = rating >= 4 && before.level >= 2;
    const fullRecitation = rating >= 4 && before.level === 5 && challenge.mode === "full";

    p.level = next.level;
    p.interval = next.interval;
    p.dueDate = next.dueDate;
    p.repetitions += 1;
    if (rating <= 1) p.lapses += 1;
    if (qualifyingPass) p.passes += 1;
    if (fullRecitation) p.successfulRecitations += 1;
    p.lastRating = rating;
    p.updatedAt = reviewedAt;
    reviewSession.missedWords.forEach(word => { p.troubleWords[word] = Number(p.troubleWords[word] || 0) + 1; });

    const record = { reviewedAt, rating, challengeMode: challenge.mode, before, after: next };
    p.reviewHistory.push(record);
    if (p.reviewHistory.length > 250) p.reviewHistory = p.reviewHistory.slice(-250);
    state.reviewLog.push({ passageId: p.id, reference: challenge.reference, ...record });
    if (state.reviewLog.length > 7500) state.reviewLog = state.reviewLog.slice(-7500);

    const newlyUnlocked = refreshUnlocks(state);
    reviewSession.unlocked.push(...newlyUnlocked);
    saveState();

    reviewSession.completed += 1;
    reviewSession.attemptCounts[p.id] = Number(reviewSession.attemptCounts[p.id] || 0) + 1;

    const remainingIds = new Set(reviewSession.queue.slice(reviewSession.index + 1).map(item => item.id));
    if (p.dueDate <= todayISO() && reviewSession.attemptCounts[p.id] < 2 && !remainingIds.has(p.id)) {
      reviewSession.queue.push(p);
      remainingIds.add(p.id);
    }

    newlyUnlocked.forEach(id => {
      if (reviewSession.newItemsAdded >= state.settings.dailyNewLimit) return;
      const unlocked = passageById(id);
      if (unlocked && !remainingIds.has(unlocked.id)) {
        reviewSession.queue.push(unlocked);
        remainingIds.add(unlocked.id);
        reviewSession.newItemsAdded += 1;
      }
    });

    reviewSession.index += 1;
    if (reviewSession.index >= reviewSession.queue.length) finishReview();
    else renderReviewCard();
  }

  function finishReview() {
    const completed = reviewSession?.completed || 0;
    const unlockedItems = [...new Set(reviewSession?.unlocked || [])].map(id => passageById(id)).filter(Boolean);
    const unlockedHTML = unlockedItems.length
      ? `<div class="unlock-summary"><span>Newly unlocked</span>${unlockedItems.map(p => `<strong>${escapeHTML(p.reference)} · ${escapeHTML(p.title)}</strong>`).join("")}</div>`
      : "";
    reviewSession = null;
    const container = document.getElementById("view-review");
    container.innerHTML = `<div class="review-shell"><article class="review-card complete-card">
      <div class="empty-mark">✓</div>
      <h1><span class="illuminated-initial">R</span>eview complete</h1>
      <p class="instruction">${completed} attempt${completed === 1 ? "" : "s"} completed. Accurate active recall advances the chapter path; durable mastery still requires spaced, full recitations.</p>
      ${unlockedHTML}
      <div class="review-actions"><button class="btn btn-primary" id="returnTodayBtn">Return to today</button><button class="btn btn-secondary" id="openTreeBtn">Open chapter tree</button></div>
    </article></div>`;
    document.getElementById("returnTodayBtn").addEventListener("click", () => { renderAll(); switchView("today"); });
    document.getElementById("openTreeBtn").addEventListener("click", () => { renderAll(); switchView("library"); });
  }

  document.querySelectorAll(".nav-btn").forEach(btn => btn.addEventListener("click", () => switchView(btn.dataset.view)));
  document.getElementById("quickAddBtn").addEventListener("click", () => switchView("add"));
  document.querySelectorAll("[data-close-dialog]").forEach(btn => btn.addEventListener("click", () => document.getElementById(btn.dataset.closeDialog).close()));
  document.getElementById("runImportBtn").addEventListener("click", importBackup);

  applyTheme();
  window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
    if (state.settings.theme === "system") applyTheme();
  });
  renderAll();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
  }
</script>
</body>
</html>
